name: Independent spline reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare reference and production table
        run: |
          mkdir -p research-ci
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path("source/processes/electromagnetic/standard")
          header=(root/"include/G4NISTStoppingData.hh").read_text()
          src=(root/"src/G4PSTARStopping.cc").read_text()
          x=re.search(r'T0\s*\[\s*\d+\s*\]\s*=\s*\{([^}]+)\}',header,re.S).group(1)
          xs=[v.strip().split('*')[0].strip() for v in x.split(',') if v.strip()][:60]
          assert len(xs)==60
          tables=re.findall(r'static\s+const\s+G4float\s+e(\d+)\s*\[\s*60\s*\]\s*=\s*\{([^}]+)\}',src,re.S)
          assert sorted(int(i) for i,_ in tables)==list(range(74))
          out=["const std::vector<double> pstar_x={"+",".join(xs)+"};","const std::vector<std::vector<double>> pstar_tables={"]
          for i,y in sorted(tables,key=lambda t:int(t[0])):
            ys=[v.strip() for v in y.split(',') if v.strip()]
            assert len(ys)==60
            out.append("{"+",".join("double("+v+")" for v in ys)+"},")
          out.append("};")
          Path("research-ci/pstar_data.hh").write_text("\n".join(out)+"\n")
          PY
          cat > research-ci/spline_reference.cc <<'CPP'
          #include "G4PhysicsFreeVector.hh"
          #include <algorithm>
          #include <cmath>
          #include <iomanip>
          #include <iostream>
          #include <vector>
          #include "pstar_data.hh"
          using V=std::vector<double>;
          V reference(const V& x,const V& y,bool fixed,double d0=0,double dn=0){
            const size_t n=x.size();
            std::vector<V> a(n,V(n+1,0.));
            for(size_t i=1;i+1<n;++i){
              double l=x[i]-x[i-1],r=x[i+1]-x[i];
              a[i][i-1]=l; a[i][i]=2*(l+r); a[i][i+1]=r;
              a[i][n]=6*((y[i+1]-y[i])/r-(y[i]-y[i-1])/l);
            }
            double h=x[1]-x[0], k=x[2]-x[1], u=x[n-2]-x[n-3],v=x[n-1]-x[n-2];
            if(fixed){
              a[0][0]=2*h; a[0][1]=h; a[0][n]=6*((y[1]-y[0])/h-d0);
              a[n-1][n-2]=v; a[n-1][n-1]=2*v; a[n-1][n]=6*(dn-(y[n-1]-y[n-2])/v);
            }else{
              a[0][0]=-k; a[0][1]=h+k; a[0][2]=-h;
              a[n-1][n-3]=-v; a[n-1][n-2]=u+v; a[n-1][n-1]=-u;
            }
            for(size_t i=0;i<n;++i){
              size_t p=i; for(size_t j=i+1;j<n;++j) if(std::abs(a[j][i])>std::abs(a[p][i]))p=j;
              std::swap(a[p],a[i]); double pivot=a[i][i];
              for(size_t j=i;j<=n;++j)a[i][j]/=pivot;
              for(size_t j=0;j<n;++j)if(j!=i){double f=a[j][i]; for(size_t k=i;k<=n;++k)a[j][k]-=f*a[i][k];}
            }
            V m(n); for(size_t i=0;i<n;++i)m[i]=a[i][n];return m;
          }
          double eval(const V& x,const V& y,const V& m,size_t i,double t){
            double h=x[i+1]-x[i], b=(t-x[i])/h,a=1-b;
            return a*y[i]+b*y[i+1]+h*h/6*((a*a*a-a)*m[i]+(b*b*b-b)*m[i+1]);
          }
          int fail=0,pass=0,oracle_fail=0;
          void check(const char* label,const V& x,const V& y,bool fixed,int degree=0){
            double d0=degree==2?2*x.front():3*x.front()*x.front(),dn=degree==2?2*x.back():3*x.back()*x.back();
            auto m=reference(x,y,fixed,d0,dn);
            G4PhysicsFreeVector vec(x,y,true);
            if(fixed)vec.FillSecondDerivatives(G4SplineType::FixedEdges,d0,dn);else vec.FillSecondDerivatives();
            double maxerr=0,wx=0,wa=0,we=0;int bad=0,total=0;
            for(size_t i=0;i+1<x.size();++i)for(double b:{0.25,0.5,0.75}){
              double t=x[i]+b*(x[i+1]-x[i]), e=eval(x,y,m,i,t),a=vec.Value(t);
              if(degree){double truth=degree==2?t*t:t*t*t;if(std::abs(e-truth)>1e-10*std::max(1.,std::abs(truth)))++oracle_fail;}
              double err=std::abs(a-e)/std::max(1e-12,std::abs(e));
              if(!std::isfinite(a)||err>1e-9){++bad;++fail;}else ++pass;
              ++total;if(err>maxerr){maxerr=err;wx=t;wa=a;we=e;}
            }
            std::cout<<label<<" checks="<<total<<" failures="<<bad<<" max_relative="<<maxerr<<" x="<<wx<<" actual="<<wa<<" reference="<<we<<'\n';
          }
          int main(){
            std::cout<<std::setprecision(15);
            for(auto x:{V{1,2,3,4,5,6},V{1,1.5,3,4,7,9},V{1,2,3,4,5},V{1,1.25,3,7},V{0.001,0.0015,0.005,0.1,2.,7.}})for(int d:{2,3}){
              V y;for(double t:x)y.push_back(d==2?t*t:t*t*t);
              if(x.size()>=5)check(d==2?"quadratic base":"cubic base",x,y,false,d);
              check(d==2?"quadratic fixed":"cubic fixed",x,y,true,d);
            }
            for(size_t i=0;i<pstar_tables.size();++i){
              auto label="PSTAR e"+std::to_string(i)+" base";
              check(label.c_str(),pstar_x,pstar_tables[i],false);
            }
            std::cout<<"SUMMARY PASS="<<pass<<" FAIL="<<fail<<" ORACLE_FAIL="<<oracle_fail<<'\n';
            return oracle_fail?2:fail?1:0;
          }
          CPP
          printf '\nadd_executable(g4_spline_reference research-ci/spline_reference.cc)\ntarget_link_libraries(g4_spline_reference PRIVATE G4global)\n' >> CMakeLists.txt
      - name: Build and compare unmodified baseline
        run: |
          file=source/global/management/src/G4PhysicsVector.cc
          cp "$file" "$RUNNER_TEMP/patched.cc"
          git show 044ac690985b37068b83a4ff97a04a734e83ccd5:"$file" > "$file"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGEANT4_INSTALL_DATA=OFF
          cmake --build build --target g4_spline_reference --parallel 2
          set +e
          ./build/BuildProducts/bin/g4_spline_reference | tee "$RUNNER_TEMP/baseline.txt"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 1
          grep -q 'ORACLE_FAIL=0$' "$RUNNER_TEMP/baseline.txt"
      - name: Build and compare candidate
        run: |
          cp "$RUNNER_TEMP/patched.cc" source/global/management/src/G4PhysicsVector.cc
          cmake --build build --target g4_spline_reference --parallel 2
          ./build/BuildProducts/bin/g4_spline_reference | tee "$RUNNER_TEMP/candidate.txt"
