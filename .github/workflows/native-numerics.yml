name: Native numerical invariant check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated build target
        run: |
          mkdir -p research-ci
          cat > research-ci/probe.cc <<'CPP'
          #include "G4SimpleIntegration.hh"
          #include "G4StatDouble.hh"
          #include "G4DataInterpolation.hh"
          #include <cmath>
          #include <iostream>
          double linear(double x) { return x; }
          int main() {
            G4SimpleIntegration q(linear);
            int failed = 0;
            for (double a : {0., 1., 2., -2.}) {
              for (int n : {1, 8, 64}) {
                double b = a + 1.;
                double expected = (b*b-a*a)/2.;
                double actual = q.Gauss(a,b,n);
                bool pass = std::abs(actual-expected) < 1e-12;
                std::cout << "a=" << a << " n=" << n << " expected=" << expected
                          << " actual=" << actual << " " << (pass?"PASS":"FAIL") << std::endl;
                failed += !pass;
              }
            }
            G4StatDouble direct(7.0), accumulated;
            accumulated.fill(7.0);
            bool stat = std::abs(direct.mean()-accumulated.mean()) < 1e-12;
            std::cout << "stat constructor equivalence expected=" << accumulated.mean()
                      << " actual=" << direct.mean() << " " << (stat?"PASS":"FAIL") << std::endl;
            failed += !stat;
            double x[] = {0., 1., 2., 3.}, y[] = {0., 1., 8., 27.};
            double xr[] = {3., 2., 1., 0.}, yr[] = {27., 8., 1., 0.};
            G4DataInterpolation asc(x,y,4,0.,27.), desc(xr,yr,4,27.,0.);
            for (double t : {0.5, 1.5, 2.5}) {
              double expected = t*t*t;
              double a = asc.CubicSplineInterpolation(t), d = desc.CubicSplineInterpolation(t);
              bool pass = std::abs(a-expected)<1e-12 && std::abs(d-expected)<1e-12;
              std::cout << "spline x=" << t << " expected=" << expected << " asc=" << a
                        << " desc=" << d << " " << (pass?"PASS":"FAIL") << std::endl;
              failed += !pass;
            }
            return failed ? 1 : 0;
          }
          CPP
          printf '\nadd_executable(g4_numerics_probe research-ci/probe.cc)\ntarget_link_libraries(g4_numerics_probe PRIVATE G4global)\n' >> CMakeLists.txt
      - name: Configure and build native target
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGEANT4_INSTALL_DATA=OFF
          cmake --build build --target g4_numerics_probe --parallel 2
      - name: Run numerical invariant check
        run: ./build/BuildProducts/bin/g4_numerics_probe
